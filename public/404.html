<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101016" />
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="That PLAYFORGE page could not be found. Head back to the app or explore the challenges." />
    <title>Page not found | PLAYFORGE</title>
    <link rel="icon" type="image/svg+xml" href="/playforge.svg" />
    <style>
      :root { color-scheme: dark; font-family: "DM Sans", Inter, system-ui, sans-serif; background: #101016; color: #f5f5f7; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #24352e 0, #101016 58%); }
      main { width: min(100%, 620px); text-align: center; padding: 52px 28px; border: 1px solid #34363d; border-radius: 28px; background: rgba(23,24,31,.88); box-shadow: 0 24px 80px rgba(0,0,0,.32); }
      .mark { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: #8df0bd; color: #14241c; font-weight: 900; font-size: 25px; }
      .code { margin: 28px 0 8px; color: #8df0bd; font-size: 13px; font-weight: 800; letter-spacing: .22em; }
      h1 { margin: 0; font-size: clamp(32px, 7vw, 52px); letter-spacing: -.05em; }
      p { max-width: 420px; margin: 16px auto 28px; color: #b7bac4; line-height: 1.7; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 20px; border: 1px solid #474a54; border-radius: 999px; color: #f5f5f7; text-decoration: none; font-weight: 700; }
      a.primary { border-color: #8df0bd; background: #8df0bd; color: #14241c; }
      a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <p class="code">ERROR 404</p>
      <h1>This page went off quest.</h1>
      <p>The page you’re looking for may have moved or no longer exists. Your progress is still yours — let’s get you back on track.</p>
      <nav aria-label="Helpful links">
        <a class="primary" href="/">Back to PLAYFORGE</a>
        <a href="/challenge/">Explore challenges</a>
      </nav>
    </main>
  </body>
</html>
