name: PLAYFORGE verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit generated npm lockfile
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            let exists = false;
            try {
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'package-lock.json',
                ref: branch,
              });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!exists) {
              const fs = require('fs');
              const content = fs.readFileSync('package-lock.json').toString('base64');
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'package-lock.json',
                message: 'chore: commit npm dependency lockfile',
                content,
                branch,
              });
            }
